<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=400, height=1080, initial-scale=1.0" />
  <title> 부드러운 우유연 :::: (너비400, 높이1080) </title>
  <style>

    @font-face {
        font-family: 'GeekbleMalrangiche';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/GeekbleMalang2WOFF2.woff2') format('woff2');
        font-weight: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Netmarble';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.1/netmarbleB.woff') format('woff');
        font-weight: 400;
        font-display: swap;
    }
    
    :root {
      --w: 400px;
      --h: 1080px;
      --row-gap: 4px;
      --icon-col: 34px;
      --num-col: 80px;
      --num-icon-size: 22px;
      --svg-h: 30px;
      --page-gap: 10px;
      --loop-seconds: 60s;
      --sequence-height: 1000px;
      --outline: 5;
      --scale: 1.0;
      --fixed-top-width: 85%;
      --fixed-bottom-width: 85%;

      /* ===== 고정 타이틀 영역 ===== */
      --fixed-title-h: 36px;
      --fixed-title-mb: 2px;
  
      /* ===== 고정 페이지 영역 ===== */
      --fixed-page-side-gap: 0px; /* ← 원하는 값 */
      --fixed-page-h: 0px;

      /* ===== 하단 고정바 제작자 영역 ===== */
      --fixed-bottom-h: 20px;
      --fixed-bottom-bottom: 4px;
      --fixed-bottom-mt: 0px;

      --fixed-top-page-h: 0px;
      --fixed-bottom-page-h: 0px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background: transparent !important;
    }

    body {
      font-family: 'GeekbleMalrangiche', 'Netmarble', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      background: transparent !important;
    }

    .overlay {
      position: relative;
      width: var(--w);
      height: var(--h);
      box-sizing: border-box;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    .fixed-title-wrap {
      position: absolute;
      left: 4px;
      top: 4px;
      width: calc(100% - 8px);
      height: var(--fixed-title-h);
      z-index: 10;
      pointer-events: none;
      background: transparent;
    }
    
    .viewport {
      position: absolute;
      left: 4px;
      top: calc(
        var(--fixed-title-h)
        + var(--fixed-title-mb)
        + var(--fixed-top-page-h)
      );
      width: calc(100% - 8px);
      height: calc(
        100%
        - var(--fixed-title-h)
        - var(--fixed-title-mb)
        - var(--fixed-bottom-h)
        - var(--fixed-bottom-bottom)
        - var(--fixed-top-page-h)
        - var(--fixed-bottom-page-h)
      );
      overflow: hidden;
      z-index: 1;
    }

    .track {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
      animation: riseLoop var(--loop-seconds) linear infinite;
      animation-play-state: paused; /* 설정을 읽기 전에는 움직이지 않음 */
    }

    /* 정지 모드에서는 위치 이동을 차단하고 색상 효과는 유지한다. */
    html[data-scroll-mode="static"] .track {
      animation: none !important;
      transition: none !important;
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      transform: none !important;
      will-change: auto;
    }
    /* 정지 모드: 모든 애니메이션 차단 후 색상 전용 효과만 허용한다. */
    html[data-scroll-mode="static"] .sequence,
    html[data-scroll-mode="static"] .sequence * {
      animation: none !important;
      transition: none !important;
    }
    html[data-scroll-mode="static"] .waveChar {
      transform: none !important;
    }
    html[data-scroll-mode="static"] .e-colorshift text {
      animation: colorShift 1.6s linear infinite !important;
    }
    html[data-scroll-mode="static"] .page-title.e-colorshift .page-title-text {
      animation: titleColorShift 1.6s linear infinite !important;
    }
    html[data-scroll-mode="static"] #sequenceB {
      display: none !important;
    }

    .sequence {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .page {
      width: 100%;
    }

    .page-gap {
      width: 100%;
      height: var(--page-gap);
      flex: 0 0 var(--page-gap);
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0 0;
    }

    /* =========================
      시그명칭과 각주 간격 제어
    ========================= */

    /* 일반 시그 행의 기본 하단 간격 */
    tbody tr.main-row td {
      padding-bottom: var(--row-gap);
    }

    /*
      각주가 있는 시그 행은
      시그명칭 아래 기본 간격 제거
    */
    tbody tr.main-row.has-footnote td {
      padding-bottom: 0;
    }

    /*
      각주 행 자체는 위쪽 여백 없이 배치하고,
      아래쪽에는 다음 시그명칭과의 간격 적용
    */
    tbody tr.footnote-row td {
      padding-top: 0;
      padding-bottom: 2px;
      height: auto;
      vertical-align: top;
    }

    col.num-col { width: var(--num-col); }
    col.icon-col { width: var(--icon-col); }

    td {
      padding-left: 2px;
      vertical-align: middle;
      white-space: nowrap;
      line-height: 1;
    }

    td.num {
      text-align: left;
    }

    .num-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      width: max-content;
      height: var(--svg-h);
    }

    .num-left-icon {
      padding-left: 2px;
      width: var(--num-icon-size);
      height: var(--num-icon-size);
      flex: 0 0 var(--num-icon-size);
      position: relative;
      top: -4px;
      object-fit: contain;
      display: block;
      margin: 0;

        /* 검정 외곽선 */
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.9));
/* 이부분 수정금지 브라우저 렌더링시 프레임 드랍현상 발생      
        drop-shadow(0 0 1px #000)
        drop-shadow(1px 0 0 #000)
        drop-shadow(-1px 0 0 #000)
        drop-shadow(0 1px 0 #000)
        drop-shadow(0 -1px 0 #000);
*/
    }

    td.label {
      padding-left: 4px;
    }

    td.icon-cell {
      width: 34px;
      text-align: left;
      vertical-align: middle;
    }

    td.footnote {
      padding: 0 0 0 6px;
      white-space: normal;
      line-height: 1;
      height: auto;
      vertical-align: top;
    }

    .page-title {
      width: 240px;
      height: 36px;

      display: flex;
      align-items: center;       /* 세로 중앙 */
      justify-content: center;   /* 가로 중앙 */

      margin: 0 0 6px 0;
      text-align: center;

      font-family: 'GeekbleMalrangiche', 'Netmarble', Arial, sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #ffffff;

      border: 2px solid currentColor;
      border-radius: 10px;
      box-sizing: border-box;

      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
         
      transform: translateY(-1px);
    }

    .page-title-text {
      display: inline-block;
      min-width: 0;
      line-height: 1;
      /* 말랑이체의 아래로 치우친 글자 위치를 보정 */
      position: relative;
      top: -3px;
    }

    /*
      DATA C열 카테고리효과
      기존 강조 값 e_colorshift / e-colorshift와 동일하게 처리
    */
    .page-title.e-colorshift .page-title-text {
      animation: titleColorShift 1.6s linear infinite;
    }

    /*
      DATA D열 카테고리아이콘
      페이지 타이틀 오른쪽에 표시
    */
    .page-title-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
    }

    .page-title-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .title-gray {
      background: #bfbfbf;
      border-color: #262525;
    }

    .title-pink {
      background: #FAB0C1;
      border-color: #D36C86;
    }

    .title-red {
      background: #ff3232;
      border-color: #ed1d1d;
    }

    .title-orange {
      background: #EF9573;
      border-color: #C96541;
    }

    .title-yellow {
      background: #FEFA94;
      border-color: #D4BE36;
    }

    .title-purple {
      background: #9656bd;
      border-color: #7727a8;
    }

    .title-blue {
      background: #4A90E2;
      border-color: #1F5EA6;
    }

    .title-green {
      background: #8acf6d;
      border-color: #4DAF2A;
    }

    .title-skyblue {
      background: #6dbbcf;
      border-color: #016fff;
    }

    .title-Apricot {
      background: #f7a167;
      border-color: #ff8738;
    }

    .title-white {
      background: #ffffff;
      border-color: #818181;
    }


    .label-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0;
      width: auto;
    }
    
    /* 숫자와 시그명칭은 기본 높이를 고정 */
    .num-svg,
    .label-svg {
      display: block;
      width: auto;
      height: var(--svg-h);
      min-height: var(--svg-h);
      overflow: visible;
      flex: 0 0 auto;
    }

    /* 각주는 줄 수에 따라 높이를 자동 확장 */
    .footnote-svg {
      display: block;
      width: auto;
      height: auto;
      overflow: visible;
      flex: 0 0 auto;
      /*
        각주를 자신의 시그명칭 쪽으로 당김.
        레이아웃 공간은 유지되므로
        다음 시그명칭과는 더 분리됨.
      */
      position: relative;
      top: -10px;
    }

    .label-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px; /* 텍스트와 아이콘의 간격 */
      position: relative;
      top: -2px;  /* 아이콘을 위로 2px 올림 */
    }

    .label-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .label-text {
      flex: 0 0 auto;
      min-width: auto;
    }

    .fixed-bottom-label {
      position: absolute;
      left: 4px;
      bottom: var(--fixed-bottom-bottom);
      width: 245px;
      height: var(--fixed-bottom-h);

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'GeekbleMalrangiche', 'Netmarble', Arial, sans-serif;
      font-size: 10px;
      font-weight: 100;
      color: #ffffff;

      background: rgba(0, 0, 0, 0.55);
      border: 1px solid #ffffff;
      border-radius: 10px;

      box-sizing: border-box;
      z-index: 50;

      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px  2px 0 #000,
        2px  2px 0 #000;
    }

/*    .page2 .label-svg text {
      font-size: 22px !important;
    }

    .page2 .num-svg text {
      font-size: 22px !important;
    }
*/

    .e-colorshift text {
      animation: colorShift 1.6s linear infinite;
    }

    @keyframes colorShift {
      0%   { fill: #ff6; }
      33%  { fill: #6ff; }
      66%  { fill: #f6f; }
      100% { fill: #ff6; }
    }

    @keyframes titleColorShift {
      0%   { color: #ff6; }
      33%  { color: #6ff; }
      66%  { color: #f6f; }
      100% { color: #ff6; }
    }

    @keyframes riseLoop {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(0, calc(-1 * var(--sequence-height)), 0);
      }
    }

    .fixed-top-page {
      position: absolute;
      left: var(--fixed-page-side-gap);
      top: calc(var(--fixed-title-h) + var(--fixed-title-mb) + 4px);
      width: calc(var(--fixed-top-width) - var(--fixed-page-side-gap));

      z-index: 40;

      padding: 4px;

      border-radius: 14px;

      background: rgba(60, 60, 60, 0.35);
      border: 1px solid rgba(255,255,255,0.4);
      box-sizing: border-box;
    }

    .fixed-bottom-page {
      position: absolute;
      left: var(--fixed-page-side-gap);
      bottom: calc(var(--fixed-bottom-h) + var(--fixed-bottom-bottom) + 0px);
      width: calc(var(--fixed-bottom-width) - var(--fixed-page-side-gap));  /* 고정 페이지 유리효과 가로 폭사이즈 */

      z-index: 40;

      padding: 4px 4px 4px 4px;

      border-radius: 14px;

      background: rgba(60, 60, 60, 0.35); /* 안정적인 값 */
      border: 1px solid rgba(255,255,255,0.4);
      box-sizing: border-box;
    }

    .fixed-top-page .page + .page,
    .fixed-bottom-page .page + .page {
      margin-top: 1px;
    }

    /* 지원되는 환경에서만 blur 적용 (스케일업할 경우 blur 2px 값 조정)*/
    @supports (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px)) {
      .fixed-top-page,
      .fixed-bottom-page {
        background: rgba(120, 120, 120, 0.18);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }
    }

    .waveChar {
      display: inline-block;
      animation: wave 1s ease-in-out infinite;
    }

    @keyframes wave {
      50% {
        transform: translateY(-6px);
      }
    }

    .content-scale {
      width: calc(100% / var(--scale));
      height: calc(100% / var(--scale));

      transform: scale(var(--scale));
      transform-origin: top left;
    }

  </style>
</head>
<body>
  <div class="overlay">

    <div class="content-scale">

      <div class="fixed-title-wrap">
        <div class="page-title title-pink"><span class="page-title-text">부드러운 우유연</span></div>
      </div>

      <div class="viewport">
        <div class="track" id="track">
          <div class="sequence" id="sequenceA"></div>
          <div class="sequence" id="sequenceB" aria-hidden="true"></div>
        </div>
      </div>

      <div id="fixedTopPage" class="fixed-top-page"></div>
      <div id="fixedBottomPage" class="fixed-bottom-page"></div>

      <div class="fixed-bottom-label">
        Designed by 시프티™⭐
      </div>

    </div>

  </div>

  <script>
      /* =========================
        우클릭 / 개발자도구 차단
      ========================= */

      // 우클릭 차단
      document.addEventListener('contextmenu', e => {
        e.preventDefault();
      });

      // 드래그 선택 차단
      document.addEventListener('selectstart', e => {
        e.preventDefault();
      });

      // 드래그 차단
      document.addEventListener('dragstart', e => {
        e.preventDefault();
      });

      // 개발자도구 단축키 차단
      document.addEventListener('keydown', e => {

        // F12
        if (e.key === 'F12') {
          e.preventDefault();
          return false;
        }

        // Ctrl+Shift+I
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
          e.preventDefault();
          return false;
        }

        // Ctrl+Shift+J
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
          e.preventDefault();
          return false;
        }

        // Ctrl+Shift+C
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          return false;
        }

        // Ctrl+U
        if (e.ctrlKey && e.key.toLowerCase() === 'u') {
          e.preventDefault();
          return false;
        }

        // Ctrl+S
        if (e.ctrlKey && e.key.toLowerCase() === 's') {
          e.preventDefault();
          return false;
        }

      });

    let PAGE_DATA = {};
    let scrollEnabled = true;

    // CODE!L1: TRUE = 수정모드(기존 화면 유지), FALSE = 운영모드
    const CONTROL_POLL_MS = 3000;
    const DATA_POLL_MS = 10000;
    const REQUEST_TIMEOUT_MS = 15000;
    let hasRenderedData = false;
    let loadNotice = null;

    function showLoadNotice(message) {
      if (!loadNotice) {
        loadNotice = document.createElement('div');
        loadNotice.setAttribute('role', 'status');
        loadNotice.style.cssText = 'position:fixed;top:90px;left:12px;right:12px;z-index:9999;padding:12px;border-radius:8px;background:rgba(0,0,0,.85);color:#fff;font:14px/1.5 sans-serif;white-space:pre-wrap;overflow-wrap:anywhere';
        document.body.appendChild(loadNotice);
      }
      loadNotice.textContent = message;
      loadNotice.style.display = message ? 'block' : 'none';
    }

    function reportLoadError(stage, error) {
      console.warn(stage, error);
      // 정상 메뉴가 없을 때만 안내를 표시해 방송 중 기존 화면을 가리지 않는다.
      if (!hasRenderedData) showLoadNotice(stage + '\n' + String(error.message || error) + '\n자동으로 다시 시도합니다.');
    }
    const CACHE_KEY = 'milkyeon-overlay-last-good-20261031-v2';
    let editMode = true; // 기본은 잠금: 상태 미확인 시 수정 데이터를 반영하지 않는다.
    let lastDataSignature = '';
    let lastDataCheckAt = 0;
    let updateInProgress = false;
    let controlInProgress = false;
    let stateInitialized = false;
    let controlGeneration = 0;
    const API_SCHEMA = 'milkyeon-l1-v2';
    function validateStatus(value) {
      if (!value || value.schema !== API_SCHEMA || typeof value.editMode !== 'boolean') {
        throw new Error('GAS 응답에 L1 제어 정보가 없습니다. GAS를 최신 버전으로 재배포하고 URL을 확인하세요.');
      }
      return value.editMode;
    }



    /* =========================
       컬럼별 폰트 설정
       - 숫자/단가
       - 일반 텍스트
       - 각주
    ========================= */

    const NUMBER_FONT =
      'GeekbleMalrangiche, Arial, sans-serif';

    const LABEL_FONT =
      'GeekbleMalrangiche, Arial, sans-serif';

    const FOOTNOTE_FONT =
      'GeekbleMalrangiche, Arial, sans-serif';
      
    const STROKE = getComputedStyle(document.documentElement)
      .getPropertyValue('--outline')
      .trim() || 5;
    const ICON_PUNG_P1 = 'https://i.imgur.com/2PvVhKn.png'; //빨강하트
    const ICON_PUNG_P2 = 'https://i.imgur.com/l0gSwJk.png'; //핑크하트
    const ICON_PUNG_P3 = 'https://i.imgur.com/D0ldyfG.png'; //주황하트
    const ICON_PUNG_P4 = 'https://i.imgur.com/12lhyTv.png'; //노랑하트
    const ICON_PUNG_P5 = 'https://i.imgur.com/3i8eoNA.png'; //보라하트
    const ICON_PUNG_P6 = 'https://i.imgur.com/qGz1W0y.png'; //회색하트
    const ICON_PUNG_P7 = 'https://i.imgur.com/cBt4rIi.png'; //파랑하트
    const ICON_PUNG_P8 = 'https://i.imgur.com/DLqjxNt.png'; //하늘하트
    const ICON_PUNG_P9 = 'https://i.imgur.com/eplGoPG.png'; //초록하트

    const PAGE_ICON_MAP = {
        'page1': ICON_PUNG_P1,
        'page2': ICON_PUNG_P1,
        'page3': ICON_PUNG_P1,
        'page4': ICON_PUNG_P1,
        'page5': ICON_PUNG_P1
    };

    let FIXED_PAGE_KEYS = [];
    let FIXED_PAGE_POSITION_MAP = {};
    let PAGE_ICON_ENABLED_MAP = {};
    // 고정 페이지 설정

    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzjJbHmOmKYz4eEr5G-a3HHKnDKEuJKwIigcFfEba3gObmI0konQOBomNl-Oy1MMi3b/exec';
    // GAS Ver 0.2 사용

let jsonpSequence = 0;

function fetchJson(mode = 'data') {
  return new Promise((resolve, reject) => {
    const callback =
      `milkyeon_cb_${Date.now()}_${++jsonpSequence}`;

    const url = new URL(GAS_URL);
    url.searchParams.set('mode', mode);
    url.searchParams.set('callback', callback);
    url.searchParams.set('_', String(Date.now()));

    const script = document.createElement('script');
    let settled = false;
    let timeout;

    function finish(error, data) {
      if (settled) return;
      settled = true;

      clearTimeout(timeout);
      script.onload = null;
      script.onerror = null;
      script.remove();

      // 시간 초과 후 도착한 응답은 반영하지 않는다.
      window[callback] = () => {};
      setTimeout(() => {
        delete window[callback];
      }, 60000);

      if (error) {
        reject(new Error(
          `[${mode}] ${error.message || error}`
        ));
      } else {
        resolve(data);
      }
    }

    window[callback] = data => {
      try {
        if (!data || typeof data !== 'object') {
          throw new Error('GAS 응답이 비어 있습니다.');
        }

        if (data.error) {
          throw new Error(String(data.error));
        }

        validateStatus(data);

        if (
          mode === 'data' &&
          !data.editMode &&
          (
            !data.pages ||
            typeof data.pages !== 'object' ||
            Array.isArray(data.pages)
          )
        ) {
          throw new Error('GAS 메뉴 응답에 pages가 없습니다.');
        }

        finish(null, data);
      } catch (error) {
        finish(error);
      }
    };

    script.async = true;
    script.src = url.toString();

    script.onerror = () => {
      finish(new Error(
        'GAS JSONP 연결 실패. 웹앱 배포와 네트워크를 확인하세요.'
      ));
    };

    script.onload = () => {
      if (!settled) {
        finish(new Error(
          'JSONP 응답이 없습니다. GAS를 JSONP 지원 버전으로 재배포하세요.'
        ));
      }
    };

    timeout = setTimeout(() => {
      finish(new Error('GAS JSONP 응답 시간 초과 (15초)'));
    }, REQUEST_TIMEOUT_MS);

    try {
      document.head.appendChild(script);
    } catch (error) {
      finish(error);
    }
  });
}

    // 변경이 없으면 DOM을 재생성하지 않도록 데이터/설정 전체 비교
    function signatureOf(data) {
      const { editMode, ...payload } = data;
      return JSON.stringify(payload);
    }

    function saveLastGood(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
    }

    function getLastGood() {
      try {
        const saved = localStorage.getItem(CACHE_KEY);
        return saved ? JSON.parse(saved) : null;
      } catch (_) { return null; }
    }

    function applySheetData(data) {
      /* =========================
        스크롤 속도 적용
      ========================= */

      const speedMissing = data.scrollSeconds == null;
      const requestedSeconds = speedMissing ? 60 : Number(data.scrollSeconds);
      const scrollSeconds = Number.isFinite(requestedSeconds) && requestedSeconds >= 0
        ? requestedSeconds : 60;
      scrollEnabled = scrollSeconds > 0;
      document.documentElement.setAttribute('data-scroll-mode', scrollEnabled ? 'scroll' : 'static');
      const style = document.documentElement.style;
      // 0초 애니메이션 대신 일시정지하여 첫 화면을 유지한다.
      style.setProperty('--loop-seconds', `${scrollEnabled ? scrollSeconds : 60}s`);
      const scale = Number(data.scale);
      style.setProperty('--scale', `${Number.isFinite(scale) && scale > 0 ? scale : 1}`);
      for (const [name, raw] of [
        ['--fixed-top-width', data.fixedTopWidthPercent],
        ['--fixed-bottom-width', data.fixedBottomWidthPercent]
      ]) {
        const value = Number(raw);
        style.setProperty(name, `${Number.isFinite(value) && value > 0 && value <= 100 ? value : 85}%`);
      }

      /* =========================
        고정 페이지 처리
      ========================= */

      if (Array.isArray(data.fixedPages)) {
        FIXED_PAGE_KEYS = data.fixedPages;
      } else {
        FIXED_PAGE_KEYS = [];
      }

      /* =========================
        고정 페이지 상단/하단
      ========================= */
      if (
        data.fixedPagePositions &&
        typeof data.fixedPagePositions === 'object'
      ) {
        FIXED_PAGE_POSITION_MAP = data.fixedPagePositions;
      } else {
        FIXED_PAGE_POSITION_MAP = {};
      }

      /* =========================
        PAGE_ICON_MAP 좌측 이미지 ON/OFF
      ========================= */

      if (data.pageIconEnabled && typeof data.pageIconEnabled === 'object') {
        PAGE_ICON_ENABLED_MAP = data.pageIconEnabled;
      } else {
        PAGE_ICON_ENABLED_MAP = {};
      }

      /* =========================
        페이지 데이터
      ========================= */

      PAGE_DATA = Object.fromEntries(
        Object.entries(data.pages || {}).filter(([_, pageObj]) =>
          pageObj && Array.isArray(pageObj.rows) &&
          pageObj.rows.length > 0 &&
          pageObj.enabled !== false
        )
      );

    }

    function esc(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function normalizeLineBreaks(value) {
      return String(value ?? '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n');
    }

    function splitLines(value) {
      return normalizeLineBreaks(value).split('\n');
    }

    function makeTspans(
      value,
      {
        x = 0,
        firstY = 24,
        lineHeight = 28
      } = {}
    ) {

      return splitLines(value)
        .map((line, index) => {

          const safeLine = esc(line);

          const y = firstY + index * lineHeight;

          return `
            <tspan
              x="${x}"
              y="${y}">${safeLine || ' '}</tspan>
          `;
        })
        .join('');
    }


    /* 컬러맵 */
    function getFillColor(variant = 'gray') {
      const COLOR_MAP = {
        gray: '#bfbfbf',
        pink: '#FAB0C1',
        orange: '#EF9573',
        yellow: '#FEFA94',
        blue: '#4A90E2',
        purple: '#DCAEF8',
        green: '#8acf6d',
        red: '#ff6b6b',
        white: '#ffffff',
        navy: '#5E4C9D',
        skyblue: '#73FBFD',
        Apricot: '#f7a167'
      };

      return COLOR_MAP[variant] || COLOR_MAP.blue;
    }

    /* 단가 */
    function makeNumberSVG(num, variant = 'blue', strike = false) {
      const measured =
        measureMultilineTextWidth(
          num,
          28,
          NUMBER_FONT,
          400
        );

      const width = Math.max(
        58,
        measured + 20
      );
      const t = esc(num);

      const fillColor = getFillColor(variant);
      const strikeLine = strike
        ? `<line x1="10" y1="13" x2="${10 + measured}" y2="13" stroke="#ff5252" stroke-width="5" stroke-linecap="round" />`
        : '';

      return `
        <svg class="num-svg" viewBox="0 0 ${width} 34" xmlns="http://www.w3.org/2000/svg" aria-label="${t}" role="img">
          <g transform="scale(1.0 1)">
          <text x="10" y="22"
            text-anchor="start"
            font-family="${NUMBER_FONT}"
            font-size="28"
            font-weight="400"
            stroke="#000000"
            stroke-width="${STROKE}"
            stroke-linejoin="round"
            paint-order="stroke fill"
            fill="${fillColor}">${t}</text>
            ${strikeLine}
          </g>
        </svg>`;
    }
    /* 텍스트 */
    const textWidthCache = new Map();
    const measureContext = document.createElement('canvas').getContext('2d');

    function measureTextWidth(
      text,
      fontSize = 32,
      fontFamily = LABEL_FONT,
      fontWeight = 400
    ) {

      const key = JSON.stringify([text, fontSize, fontFamily, fontWeight]);
      if (textWidthCache.has(key)) return textWidthCache.get(key);
      measureContext.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
      const width = Math.ceil(measureContext.measureText(text).width);
      textWidthCache.set(key, width);

      return width;
    }

      /* =========================
        여러 줄 텍스트 너비 측정

        구글시트 셀에 줄바꿈이 있으면
        각 줄의 너비를 따로 측정한 후
        가장 긴 줄의 너비를 반환
      ========================= */

      function measureMultilineTextWidth(
        value,
        fontSize = 32,
        fontFamily = LABEL_FONT,
        fontWeight = 400
      ) {

        /*
          Windows 줄바꿈 \r\n,
          단독 \r을 모두 \n으로 통일
        */
        const normalizedValue = String(value ?? '')
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n');

        /*
          줄바꿈을 기준으로 각 줄 분리
        */
        const lines = normalizedValue.split('\n');

        /*
          값이 없으면 너비 0 반환
        */
        if (!lines.length) {
          return 0;
        }

        /*
          각 줄의 너비를 측정하고
          가장 큰 너비를 반환
        */
        return Math.max(
          ...lines.map(line =>
            measureTextWidth(
              line || ' ',
              fontSize,
              fontFamily,
              fontWeight
            )
          )
        );
      }

    function makeLabelSVG(label, effect = '', strike = false) {
      const t = esc(label);
      const measured =
      measureMultilineTextWidth(
        label,
        30,
        LABEL_FONT,
        400
      );
      const w = Math.max(40, measured + 25);
      const strikeLine = strike
        ? `<line x1="15" y1="13" x2="${15 + measured}" y2="13" stroke="#ff5252" stroke-width="5" stroke-linecap="round" />`
        : '';

      return `
        <svg
          class="label-svg ${normalizeEffectClass(effect)}"
          viewBox="0 0 ${w} 34"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="${t}"
          role="img"
          preserveAspectRatio="xMinYMid meet">

          <g transform="scale(1.0 1)">
            <text x="15" y="24"
              text-anchor="start"
              font-family="${LABEL_FONT}"
              font-size="30"
              font-weight="400"
              stroke="#000000"
              stroke-width="${STROKE}"
              stroke-linejoin="round"
              paint-order="stroke fill"
                fill="#ffffff">${t}</text>
            ${strikeLine}
          </g>
        </svg>`;
    }

    /* 각주 */
    /* =========================
      각주 SVG
      구글시트 셀 내부 줄바꿈 지원
    ========================= */

    function makeFootnoteSVG(footnote) {

      const normalizedFootnote =
        normalizeLineBreaks(footnote);

      const lines =
        splitLines(normalizedFootnote);

      const lineCount =
        Math.max(1, lines.length);

      const fontSize = 22;
      const fontWeight = 300;

      /*
        각주 줄 사이의 간격
        값을 키우면 줄 간격이 넓어짐
      */
      const lineHeight = 25;

      /*
        가장 긴 줄을 기준으로 SVG 너비 계산
      */
      const measured =
        measureMultilineTextWidth(
          normalizedFootnote,
          fontSize,
          FOOTNOTE_FONT,
          fontWeight
        );

      /*
        x=110 위치에서 글자가 시작하므로
        왼쪽 공간을 포함하여 너비 계산
      */
      const width =
        Math.max(150, measured + 125);

      /*
        1줄은 30px,
        줄이 늘어날 때마다 lineHeight만큼 높이 추가
      */
      const height =
        30 + (lineCount - 1) * lineHeight;

      const ariaText =
        esc(normalizedFootnote);

      return `
        <svg
          class="footnote-svg"
          viewBox="0 0 ${width} ${height}"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="${ariaText}"
          role="img"
          preserveAspectRatio="xMinYMin meet"
          style="height:${height}px">

          <g transform="scale(0.9 1)">

            <text
              text-anchor="start"
              font-family="${FOOTNOTE_FONT}"
              font-size="${fontSize}"
              font-weight="${fontWeight}"
              stroke="#000000"
              stroke-width="${STROKE}"
              stroke-linejoin="round"
              paint-order="stroke fill"
                fill="#ffffff">

              ${makeTspans(
                normalizedFootnote,
                {
                  x: 100,
                  firstY: 22,
                  lineHeight: lineHeight
                }
              )}

            </text>

          </g>
        </svg>`;
    }
    /* 숫자 좌측 하트 이미지 */
    function makeNumberIcon(pageClass) {

      /*
        PAGE_ICON_ENABLED_MAP 값이 false이면 숨김.
        값이 없는 경우는 기존 HTML 호환을 위해 true로 처리.
      */
      const enabled = PAGE_ICON_ENABLED_MAP[pageClass] !== false;

      if (!enabled) {
        return '';
      }

      const src = PAGE_ICON_MAP[pageClass] || '';

      return src ? `<img class="num-left-icon" src="${src}" alt="풍">` : '';
    }
    /* 아이콘 SVG 이미지 내장*/

    const ICON_BASE_URL = '/overlaylist/icons/';
    const ICON_LABELS = new Map([
      ['new', 'NEW'],
      ['best', 'BEST'],
      ['warning', 'WARNING'],
      ['rullet', 'RULLET'],
      ['adult19', '19금']
    ]);

    function makeIcon(type, className) {
      const label = ICON_LABELS.get(type);
      if (!label) return '';

      return `<span class="${className}"><img src="${ICON_BASE_URL}${type}.svg" alt="${label}"></span>`;
    }

    function makeLabelIcon(type) {
      return makeIcon(type, 'label-icon');
    }

    function normalizeEffectClass(effect = '') {
      const normalizedEffect = String(effect || '')
        .trim()
        .toLowerCase()
        .replaceAll('_', '-');

      return normalizedEffect === 'e-colorshift'
        ? 'e-colorshift'
        : '';
    }

    function makePageTitleIcon(type) {
      const normalizedType = String(type || '').trim().toLowerCase();
      return makeIcon(normalizedType, 'page-title-icon');
    }

    /* 테이블 */
    function makeTable(rows, pageClass = '') {
      const bodyHTML = rows.map(([num, label, iconType = '', footnote = '', effect = '', rowColor = 'blue', strikeValue = false]) => {
        const safeNum = String(num ?? '').trim();
        const safeLabel = String(label ?? '').trim();
        const safeFootnote = String(footnote ?? '').trim();
        const strike = strikeValue === true || String(strikeValue).trim().toUpperCase() === 'TRUE';

        /*
          각주 존재 여부에 따라 행 클래스 분리

          각주 있음:
          main-row has-footnote

          각주 없음:
          main-row no-footnote
        */
        const mainRowClass = safeFootnote
          ? 'main-row has-footnote'
          : 'main-row no-footnote';

        const mainRow = `
          <tr class="${mainRowClass}">
            <td class="num">
              ${
                safeNum
                  ? `
                    <div class="num-wrap">
                      ${makeNumberIcon(pageClass)}
                      ${makeNumberSVG(safeNum, rowColor, strike)}
                    </div>
                  `
                  : ''
              }
            </td>

            <td class="label">
              <div class="label-wrap">
                <div class="label-text">
                  ${
                    safeLabel
                      ? makeLabelSVG(safeLabel, effect, strike)
                      : ''
                  }
                </div>

                ${makeLabelIcon(iconType)}
              </div>
            </td>
          </tr>`;

        const footnoteRow = safeFootnote
          ? `
          <tr class="footnote-row">
            <td class="footnote" colspan="3">${makeFootnoteSVG(safeFootnote)}</td>
          </tr>`
          : '';

        return mainRow + footnoteRow;
      }).join('');

      return `
        <table aria-label="리액션 리스트">
          <colgroup>
            <col class="num-col" />
            <col />
            <col class="icon-col" />
          </colgroup>
          <tbody>
            ${bodyHTML}
          </tbody>
        </table>`;
    }

    function makePage(
      title,
      titleClass,
      rows,
      pageClass,
      titleVisible = true,
      categoryEffect = '',
      categoryIcon = ''
    ) {

      const safeTitle = esc(title);
      const categoryEffectClass =
        normalizeEffectClass(categoryEffect);

      const titleHTML = titleVisible
        ? `
          <div class="page-title ${titleClass} ${categoryEffectClass}">
            <span class="page-title-text">${safeTitle}</span>
            ${makePageTitleIcon(categoryIcon)}
          </div>
        `
        : '';

      return `
        <div class="page ${pageClass}" data-page="${pageClass}">
          ${titleHTML}
          ${makeTable(rows, pageClass)}
        </div>`;
    }

    // 각 페이지를 한 번만 생성하고 고정/스크롤 영역에 직접 배치한다.
    function renderPages() {
      const pages = new Map();
      for (const [key, page] of Object.entries(PAGE_DATA)) {
        pages.set(key, makePage(
          page.title, `title-${page.titleColor || 'gray'}`, page.rows, key,
          page.titleVisible !== false, page.categoryEffect || '', page.categoryIcon || ''
        ));
      }
      // 정지 모드: 고정 페이지도 시트 순서로 합치고 반복 복제를 만들지 않는다.
      if (!scrollEnabled) {
        sequenceA.innerHTML = Array.from(pages.values()).join(
          '<div class="page-gap" aria-hidden="true"></div>'
        );
        sequenceB.innerHTML = '';
        sequenceB.style.display = 'none';
        fixedTopPage.innerHTML = '';
        fixedBottomPage.innerHTML = '';
        fixedTopPage.style.display = 'none';
        fixedBottomPage.style.display = 'none';
        track.style.animation = 'none';
        track.style.transform = 'none';
        return;
      }
      sequenceB.style.display = '';
      sequenceA.style.transform = '';
      track.style.animation = '';
      track.style.transform = '';
      const fixedKeys = new Set(FIXED_PAGE_KEYS);
      const scrolling = [];
      for (const [key, html] of pages) {
        if (!fixedKeys.has(key)) scrolling.push(html, '<div class="page-gap" aria-hidden="true"></div>');
      }
      const top = [];
      const bottom = [];
      for (const key of fixedKeys) {
        if (!pages.has(key)) continue;
        const position = String(FIXED_PAGE_POSITION_MAP[key] || 'bottom').trim().toLowerCase();
        (position === '상단' || position === 'top' ? top : bottom).push(pages.get(key));
      }
      const html = scrolling.join('');
      sequenceA.innerHTML = html;
      sequenceB.innerHTML = html;
      fixedTopPage.innerHTML = top.join('');
      fixedBottomPage.innerHTML = bottom.join('');
      fixedTopPage.style.display = top.length ? 'block' : 'none';
      fixedBottomPage.style.display = bottom.length ? 'block' : 'none';
      track.style.animationPlayState = scrollEnabled && scrolling.length ? 'running' : 'paused';
    }

    function applyWaveToFixedTitle() {

      if (!FIXED_PAGE_KEYS.length) return;

      const containers = [
        document.getElementById('fixedTopPage'),
        document.getElementById('fixedBottomPage')
      ];

      containers.forEach(fixedContainer => {

        if (!fixedContainer) return;

        const titles = fixedContainer.querySelectorAll('.page-title-text');

        titles.forEach(titleEl => {

          const text = titleEl.textContent.trim();

          titleEl.innerHTML = Array.from(text).map((c, i) =>
            `<span class="waveChar"
              style="animation-delay:${i * 0.08}s">${esc(c)}</span>`
          ).join('');

        });

      });
    }

    function adjustViewportHeight() {

      const scale = getScale();

      const fixedTop = document.getElementById('fixedTopPage');
      const fixedBottom = document.getElementById('fixedBottomPage');

      let topH = 0;
      let bottomH = 0;

      if (fixedTop && fixedTop.innerHTML.trim()) {
        topH = Math.ceil(
          fixedTop.getBoundingClientRect().height / scale
        ) + 12;
      }

      if (fixedBottom && fixedBottom.innerHTML.trim()) {
        bottomH = Math.ceil(
          fixedBottom.getBoundingClientRect().height / scale
        ) + 12;
      }

      const style = document.documentElement.style;
      for (const [name, value] of [['--fixed-top-page-h', `${topH}px`], ['--fixed-bottom-page-h', `${bottomH}px`]]) {
        if (style.getPropertyValue(name) !== value) style.setProperty(name, value);
      }
    }

    const sequenceA = document.getElementById('sequenceA');
    const sequenceB = document.getElementById('sequenceB');
    const fixedTopPage = document.getElementById('fixedTopPage');
    const fixedBottomPage = document.getElementById('fixedBottomPage');
    const track = document.getElementById('track');
    let layoutFrame = 0;

    // 한 프레임 안에 들어온 크기 변경은 한 번만 측정한다.
    function scheduleLayout() {
      if (layoutFrame) return;
      layoutFrame = requestAnimationFrame(() => {
        layoutFrame = 0;
        adjustViewportHeight();
        if (scrollEnabled) updateLoopHeight();
        else fitStaticPage();
      });
    }

    function getScale() {
      return parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--scale')) || 1;
    }

    // 설정 배율을 유지하되, 목록이 넘칠 때만 한 화면에 들어가도록 축소한다.
    // offset/scroll 크기는 transform의 영향을 받지 않아 반복 측정해도 누적 축소되지 않는다.
    function fitStaticPage() {
      const viewport = document.querySelector('.viewport');
      const width = Math.max(sequenceA.offsetWidth, sequenceA.scrollWidth);
      const height = Math.max(sequenceA.offsetHeight, sequenceA.scrollHeight);
      const ratio = Math.min(1,
        width > 0 ? viewport.clientWidth / width : 1,
        height > 0 ? viewport.clientHeight / height : 1
      );
      sequenceA.style.transformOrigin = 'top left';
      const fitted = `scale(${Math.floor(ratio * 1000000) / 1000000})`;
      if (sequenceA.style.transform !== fitted) sequenceA.style.transform = fitted;
    }

    function updateLoopHeight() {
      const height = Math.ceil(sequenceA.getBoundingClientRect().height / getScale());
      const value = `${height}px`;
      const style = document.documentElement.style;
      if (style.getPropertyValue('--sequence-height') !== value) {
        style.setProperty('--sequence-height', value);
      }
    }

    function redrawWithNewData(data, force = false) {
      const signature = signatureOf(data);

      if (!force && signature === lastDataSignature) {
        if (hasRenderedData) showLoadNotice('');
        return false;
      }

      applySheetData(data);
      renderPages();
      applyWaveToFixedTitle();
      scheduleLayout();

      lastDataSignature = signature;
      saveLastGood(data);

      hasRenderedData =
        sequenceA.childElementCount > 0 ||
        fixedTopPage.childElementCount > 0 ||
        fixedBottomPage.childElementCount > 0;

      showLoadNotice(
        hasRenderedData
          ? ''
          : '표시할 메뉴가 없습니다. DATA 항목과 사용 설정을 확인하세요.'
      );

      return true;
    }

    async function refreshData() {
      if (editMode || updateInProgress || !stateInitialized) return;
      const generation = controlGeneration;
      updateInProgress = true;
      try {
        const data = await fetchJson('data');
        // 요청 중 TRUE 전환이 일어났거나 응답이 잠금 상태면 반영 금지.
        if (editMode || generation !== controlGeneration || validateStatus(data)) return;
        const control = await fetchJson('status');
        const locked = validateStatus(control);
        if (locked) {
          editMode = true;
          controlGeneration++;
          return;
        }
        if (!editMode && generation === controlGeneration) redrawWithNewData(data);
      } catch (error) {
        reportLoadError('메뉴 데이터 수신 또는 화면 생성 실패', error);
      } finally {
        lastDataCheckAt = Date.now();
        updateInProgress = false;
      }
    }

    async function pollControl() {
      if (controlInProgress) return;
      controlInProgress = true;
      try {
        const control = await fetchJson('status');
        const locked = validateStatus(control);
        const wasEditing = editMode;
        if (locked !== editMode) controlGeneration++;
        editMode = locked;
        stateInitialized = true;
        if (editMode && !hasRenderedData) {
          showLoadNotice(
            '수정모드입니다. CODE!L1 체크를 해제하면 메뉴를 불러옵니다.'
          );
        }
        if (!editMode && (wasEditing || Date.now() - lastDataCheckAt >= DATA_POLL_MS)) {
          await refreshData();
        }
      } catch (error) {
        if (!editMode) controlGeneration++;
        editMode = true; // 네트워크 오류 또는 구형 GAS는 항상 갱신 차단.
        reportLoadError('GAS 상태 확인 실패', error);
      } finally {
        controlInProgress = false;
      }
    }

    async function init() {
      // 초기 요청이나 캐시 표시가 실패해도 재시도할 수 있도록 먼저 시작한다.
      setInterval(pollControl, CONTROL_POLL_MS);

      showLoadNotice('메뉴 데이터를 불러오는 중입니다.');

      const cached = getLastGood();

      if (cached) {
        try {
          redrawWithNewData(cached, true);
        } catch (error) {
          reportLoadError('저장된 메뉴 표시 실패', error);
        }
      }

      // 폰트 로딩을 기다리느라 데이터 요청이 멈추지 않도록 한다.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          textWidthCache.clear();

          if (hasRenderedData) {
            renderPages();
            applyWaveToFixedTitle();
          }

          scheduleLayout();
        }).catch(error => {
          console.warn('폰트 확인 또는 재배치 실패:', error);
        });
      }

      if (typeof ResizeObserver === 'function') {
        const observer = new ResizeObserver(scheduleLayout);

        [sequenceA, fixedTopPage, fixedBottomPage].forEach(el => {
          observer.observe(el);
        });
      }

      sequenceA.addEventListener('load', scheduleLayout, true);
      window.addEventListener('resize', scheduleLayout);

      scheduleLayout();
      await pollControl();
    }

    init().catch(error => {
      reportLoadError('메뉴판 초기화 실패', error);
    });

  </script>
</body>
</html>
